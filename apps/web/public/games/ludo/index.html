<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vyb Ludo</title><style>
:root{color-scheme:dark;--bg:#08152b;--panel:#12254a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#313c7a,transparent 40%),var(--bg);color:#f8faff;font:16px system-ui,sans-serif}main{width:min(760px,100%);margin:auto;padding:clamp(14px,4vw,30px)}h1{margin:0}p{color:#b8c6df}.top{display:flex;justify-content:space-between;gap:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.controls button,.controls select{border:1px solid #607bbd;border-radius:11px;background:#1b315a;color:#fff;padding:.62rem .8rem;font-weight:800}.controls button{cursor:pointer}.arena{position:relative;width:min(92vw,560px);aspect-ratio:1;margin:18px auto;border-radius:50%;border:12px solid #203867;background:radial-gradient(circle,#192d52 0 28%,transparent 29%),#0d1c37;box-shadow:0 18px 38px #0008}.spot{position:absolute;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#31466e;border:1px solid #6680b2}.spot.safe{background:#4e4b87}.piece{position:absolute;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff8;border-radius:50%;box-shadow:0 3px 7px #0008;cursor:pointer;touch-action:manipulation}.piece.active{outline:4px solid #fff;animation:pulse .8s infinite alternate}@keyframes pulse{to{outline-color:#4de6d0}}.center{position:absolute;inset:38%;display:grid;place-items:center;text-align:center;border-radius:50%;background:#0c1b37;border:2px solid #5873ab;font-weight:900}.token-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.token-row button{border:0;border-radius:10px;padding:.7rem;background:#28446f;color:#fff;font-weight:800;cursor:pointer}.token-row button:disabled{opacity:.4}.status{min-height:1.5em;text-align:center;font-weight:800;margin:13px 0}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px}</style></head><body><main><div class="top"><div><h1>Ludo</h1><p>2–4 local players. Unused colours automatically take quick bot turns.</p></div></div><div class="controls"><label>Players <select id="players"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><button id="new">New game</button><button id="roll">Roll dice</button></div><div class="arena" id="arena" aria-label="Ludo board"><div class="center" id="die">Roll<br>the die</div></div><p id="status" class="status" role="status"></p><div id="tokens" class="token-row"></div><div id="legend" class="legend"></div></main><script>
(()=>{const KEY='vyb.game.ludo.v1',COL=['#ff5f68','#50a7ff','#4bd391','#ffd259'],NAM=['Red','Blue','Green','Gold'],$=x=>document.getElementById(x);let s={players:2,turn:0,dice:0,pieces:[],winner:null};function fresh(){s={players:+$('players').value,turn:0,dice:0,pieces:Array.from({length:4},()=>[-1,-1,-1,-1]),winner:null};save()}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.pieces?.length===4)s=x}catch{}$('players').value=s.players}function xy(progress,player,idx){if(progress<0){let homes=[[20,20],[80,20],[80,80],[20,80]][player];return{ x:homes[0]+(idx%2?5:-5),y:homes[1]+(idx>1?5:-5)}}if(progress>=40){let homes=[[36,42],[58,36],[64,58],[42,64]][player];let p=progress-40;return{x:homes[0]+p*2,y:homes[1]+p*2}}let a=((progress+player*10)%40)/40*Math.PI*2-Math.PI/2;return{x:50+40*Math.cos(a)+(idx-1.5)*1.7,y:50+40*Math.sin(a)+(idx-1.5)*1.7}}function legal(i){let p=s.pieces[s.turn][i];return p===-1?s.dice===6:p+s.dice<=43}function render(){let a=$('arena');a.querySelectorAll('.spot,.piece').forEach(x=>x.remove());for(let i=0;i<40;i++){let t=i/40*Math.PI*2-Math.PI/2,e=document.createElement('i');e.className='spot '+(i%10===0?'safe':'');e.style.left=50+40*Math.cos(t)+'%';e.style.top=50+40*Math.sin(t)+'%';a.append(e)}for(let pl=0;pl<s.players;pl++)s.pieces[pl].forEach((p,i)=>{let q=xy(p,pl,i),e=document.createElement('button');e.className='piece '+(pl===s.turn&&s.dice&&legal(i)?'active':'');e.style.background=COL[pl];e.style.left=q.x+'%';e.style.top=q.y+'%';e.ariaLabel=`${NAM[pl]} token ${i+1}`;e.onclick=()=>move(i);a.append(e)});$('die').innerHTML=s.dice?`<b style="font-size:2.3rem">${s.dice}</b><br>${NAM[s.turn]}`:'Roll<br>the die';$('roll').disabled=!!s.dice||!!s.winner;$('status').textContent=s.winner?`${NAM[s.winner]} wins the race!`:s.dice?`Choose a ${NAM[s.turn]} token.`:`${NAM[s.turn]} to roll.`;let t=$('tokens');t.innerHTML='';s.pieces[s.turn].forEach((_,i)=>{let b=document.createElement('button');b.textContent=`${NAM[s.turn]} ${i+1}`;b.disabled=!s.dice||!legal(i);b.onclick=()=>move(i);t.append(b)});$('legend').innerHTML=NAM.slice(0,s.players).map((n,i)=>`<span><i style="background:${COL[i]}"></i>${n}</span>`).join('');save()}function next(){s.dice=0;s.turn=(s.turn+1)%s.players;render();if(s.turn>0)setTimeout(bot,380)}function roll(){if(s.dice||s.winner)return;s.dice=1+Math.floor(Math.random()*6);render();if(!s.pieces[s.turn].some((_,i)=>legal(i)))setTimeout(next,500)}function move(i){if(!legal(i)||s.winner)return;let p=s.pieces[s.turn][i];s.pieces[s.turn][i]=p<0?0:p+s.dice;if(s.pieces[s.turn][i]<40)for(let pl=0;pl<s.players;pl++)if(pl!==s.turn)s.pieces[pl]=s.pieces[pl].map(x=>x===s.pieces[s.turn][i]?-1:x);if(s.pieces[s.turn].every(x=>x===43)){s.winner=s.turn;render();return}let six=s.dice===6;s.dice=0;render();if(!six)setTimeout(next,260)}function bot(){if(s.turn===0||s.winner)return;roll();setTimeout(()=>{let i=s.pieces[s.turn].findIndex((_,j)=>legal(j));if(i>=0)move(i)},450)}$('new').onclick=fresh;$('roll').onclick=roll;$('players').onchange=fresh;load();render()})();
</script></body></html>
