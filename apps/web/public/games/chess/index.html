<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vyb Chess</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% 4%,#245761,transparent 40%),#08152a;color:#f7f9ff;font:16px system-ui,sans-serif}main{width:min(720px,100%);padding:clamp(14px,4vw,30px);margin:auto}h1{margin:0}p{color:#b6c5df}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.top button{border:1px solid #6681c1;border-radius:11px;padding:.65rem .8rem;color:#fff;background:#1b315a;font-weight:800;cursor:pointer}#board{width:min(92vw,580px);aspect-ratio:1;margin:22px auto;display:grid;grid-template-columns:repeat(8,1fr);border:7px solid #c99b5f;box-shadow:0 18px 42px #0008}.sq{border:0;display:grid;place-items:center;font-size:clamp(1.55rem,8.2vw,4rem);padding:0;cursor:pointer;touch-action:manipulation}.l{background:#f1d9b5}.d{background:#a86f46}.sel{outline:4px solid #48e3cc;outline-offset:-4px}.legal::after{content:'';width:22%;aspect-ratio:1;border-radius:50%;background:#2ed4b5bb}.capture{box-shadow:inset 0 0 0 5px #ff6b75}#status{min-height:1.5em;text-align:center;font-weight:800}.white{color:#fff;text-shadow:0 2px 1px #000}.black{color:#172030;text-shadow:0 1px #fff8}@media(max-width:430px){#board{border-width:5px}}</style></head><body><main><div class="top"><div><h1>Chess</h1><p>Local two-player chess. Illegal moves that expose your king are rejected.</p></div><button id="reset">New game</button></div><div id="board" aria-label="Chess board"></div><p id="status" role="status"></p></main><script>
(()=>{const KEY='vyb.game.chess.v1',$=x=>document.getElementById(x),icons={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};let st={b:[],turn:'w',sel:null,history:[]};function init(){st={b:['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'].map(r=>r.split('')),turn:'w',sel:null,history:[]};save()}function save(){localStorage.setItem(KEY,JSON.stringify(st))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.b?.length===8)st={...x,sel:null}}catch{}if(!st.b.length)init()}function side(p){return p&&p!=='.'?(p===p.toUpperCase()?'w':'b'):null}function inb(r,c){return r>=0&&r<8&&c>=0&&c<8}function clone(b){return b.map(r=>[...r])}function path(b,r,c,dr,dc,R,C){for(r+=dr,c+=dc;r!==R||c!==C;r+=dr,c+=dc)if(b[r][c]!=='.')return false;return true}function pseudo(b,r,c,R,C){if(!inb(R,C)||side(b[r][c])===side(b[R][C]))return false;let p=b[r][c].toLowerCase(),dr=R-r,dc=C-c,ad=Math.abs(dr),ac=Math.abs(dc);if(p==='p'){let d=side(b[r][c])==='w'?-1:1,start=side(b[r][c])==='w'?6:1;return dc===0&&dr===d&&b[R][C]==='.'||dc===0&&r===start&&dr===2*d&&b[r+d][c]==='.'&&b[R][C]==='.'||ad===1&&dr===d&&b[R][C]!=='.'}if(p==='n')return ad*ac===2;if(p==='k')return Math.max(ad,ac)===1;if(p==='b')return ad===ac&&path(b,r,c,Math.sign(dr),Math.sign(dc),R,C);if(p==='r')return (dr===0||dc===0)&&path(b,r,c,Math.sign(dr),Math.sign(dc),R,C);return (ad===ac||dr===0||dc===0)&&path(b,r,c,Math.sign(dr),Math.sign(dc),R,C)}function attacked(b,r,c,by){for(let i=0;i<8;i++)for(let j=0;j<8;j++)if(side(b[i][j])===by&&pseudo(b,i,j,r,c))return true;return false}function legal(r,c,R,C){if(!pseudo(st.b,r,c,R,C))return false;let b=clone(st.b),p=b[r][c];b[R][C]=p;b[r][c]='.';let king=side(p)==='w'?'K':'k',kr=-1,kc=-1;for(let i=0;i<8;i++)for(let j=0;j<8;j++)if(b[i][j]===king){kr=i;kc=j}return kr>=0&&!attacked(b,kr,kc,side(p)==='w'?'b':'w')}function moves(r,c){let a=[];for(let R=0;R<8;R++)for(let C=0;C<8;C++)if(legal(r,c,R,C))a.push([R,C]);return a}function check(){let king=st.turn==='w'?'K':'k';for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(st.b[r][c]===king)return attacked(st.b,r,c,st.turn==='w'?'b':'w');return false}function render(){let b=$('board');b.innerHTML='';let m=st.sel?moves(...st.sel):[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=st.b[r][c],e=document.createElement('button'),hit=m.some(x=>x[0]===r&&x[1]===c);e.className=`sq ${(r+c)%2?'d':'l'} ${p!=='.'?(side(p)==='w'?'white':'black'):''} ${st.sel?.[0]===r&&st.sel?.[1]===c?'sel':''} ${hit?(p==='.'?'legal':'capture'):''}`;e.textContent=p==='.'?'':icons[p];e.ariaLabel=`${String.fromCharCode(97+c)}${8-r}${p!=='.'?' '+p:''}`;e.onclick=()=>tap(r,c);b.append(e)}$('status').textContent=`${st.turn==='w'?'White':'Black'} to move${check()?' — check!':''}`;save()}function tap(r,c){let p=st.b[r][c];if(st.sel){let[a,b]=st.sel;if(legal(a,b,r,c)){st.history.push(JSON.stringify(st.b));st.b[r][c]=st.b[a][b];st.b[a][b]='.';if(st.b[r][c].toLowerCase()==='p'&&(r===0||r===7))st.b[r][c]=st.turn==='w'?'Q':'q';st.turn=st.turn==='w'?'b':'w';st.sel=null;render();return}}st.sel=side(p)===st.turn?[r,c]:null;render()}$('reset').onclick=init;load();render()})();
</script></body></html>
