<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vyb N-Queens</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 95% 5%,#174b62,transparent 40%),#09152b;color:#f7f9ff;font:16px system-ui,sans-serif}main{width:min(720px,100%);margin:auto;padding:clamp(16px,4vw,32px)}h1{margin:0}p{color:#b5c3df}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}.bar button,.bar select{min-height:44px;border:1px solid #6078bd;border-radius:11px;padding:.62rem .8rem;background:#1a2d56;color:#fff;font-weight:800}.bar button{cursor:pointer;touch-action:manipulation}.bar button.primary{background:linear-gradient(120deg,#5d66ff,#00c7b6)}#board{width:min(90vw,500px);aspect-ratio:1;display:grid;margin:20px auto;border:7px solid #d6b57a;box-shadow:0 14px 38px #0007;contain:layout paint}.cell{border:0;padding:0;display:grid;place-items:center;font-size:clamp(1.5rem,7vw,3rem);cursor:pointer;touch-action:manipulation}.light{background:#f1dfbc}.dark{background:#89664b}.queen{filter:drop-shadow(0 2px 1px #0007)}#status{min-height:3em;font-weight:800;text-align:center}.ok{color:#60edca}@media(max-width:480px){main{min-height:100dvh;padding:10px;display:flex;flex-direction:column}h1{font-size:1.35rem}main>p{margin:.3rem 0;font-size:.78rem;line-height:1.35}.bar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:9px 0}.bar label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px}.bar button,.bar select{width:100%;padding:.5rem;font-size:.78rem}#board{width:min(calc(100vw - 20px),500px);margin:8px auto;border-width:4px}.cell{font-size:clamp(1.15rem,8vw,2rem)}#status{min-height:3em;margin:.35rem 0;font-size:.8rem}}</style></head><body><main><h1>N-Queens Visualizer</h1><p>Place queens manually or watch the local backtracking solver animate every decision.</p><div class="bar"><label>Size <select id="n"><option>4</option><option>5</option><option selected>8</option><option>10</option></select></label><button id="solve" class="primary">Visualize solve</button><button id="step">Next step</button><button id="clear">Clear</button></div><div id="board" aria-label="N Queens board"></div><p id="status" role="status"></p></main><script>
(()=>{const KEY='vyb.game.queens.v1',$=x=>document.getElementById(x);let n=8,placed=[],steps=[],cursor=0,timer=0;function safe(row,col,a=placed){return !a.some(([r,c])=>r===row||c===col||Math.abs(r-row)===Math.abs(c-col))}function makeSteps(){let out=[],a=[];function walk(r){if(r===n){out.push({a:a.map(x=>[...x]),done:true});return true}for(let c=0;c<n;c++){if(safe(r,c,a)){a.push([r,c]);out.push({a:a.map(x=>[...x]),focus:[r,c]});if(walk(r+1))return true;a.pop();out.push({a:a.map(x=>[...x]),focus:[r,c],back:true})}}return false}walk(0);return out}function save(){localStorage.setItem(KEY,JSON.stringify({n,placed}))}function render(focus){let b=$('board');b.style.gridTemplateColumns=`repeat(${n},1fr)`;b.innerHTML='';for(let r=0;r<n;r++)for(let c=0;c<n;c++){let q=placed.some(([x,y])=>x===r&&y===c),e=document.createElement('button');e.className='cell '+((r+c)%2?'dark':'light');e.textContent=q?'♛':'';e.classList.toggle('queen',q);e.ariaLabel=`Row ${r+1}, column ${c+1}`;if(focus&&focus[0]===r&&focus[1]===c)e.style.outline='4px solid #48e1ca';e.onclick=()=>{if(!q&&safe(r,c)){placed.push([r,c])}else if(q){placed=placed.filter(([x,y])=>x!==r||y!==c)}render()};b.append(e)}let solved=placed.length===n;$('status').textContent=solved?'Solved — every queen is safe.':`${placed.length}/${n} queens placed`; $('status').className=solved?'ok':'';save()}function next(){clearTimeout(timer);if(!steps.length)steps=makeSteps();let s=steps[cursor++];if(!s){$('status').textContent='Solver completed.';return}placed=s.a;render(s.focus);if(s.done){$('status').textContent='Solved by backtracking!';$('status').className='ok'}}function run(){clearTimeout(timer);steps=makeSteps();cursor=0;function tick(){next();if(cursor<steps.length)timer=setTimeout(tick,95)}tick()}function reset(){clearTimeout(timer);placed=[];steps=[];cursor=0;render()}$('n').onchange=e=>{n=+e.target.value;reset()};$('solve').onclick=run;$('step').onclick=next;$('clear').onclick=reset;try{let x=JSON.parse(localStorage.getItem(KEY));if(x){n=x.n;placed=x.placed??[];$('n').value=n}}catch{}render()})();
</script></body></html>
