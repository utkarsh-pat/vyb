<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Vyb Color Sort</title>
  <style>
    :root{color-scheme:dark;--bg:#07152b;--ink:#f5f7ff;--muted:#aebbd9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 0,#273d78,transparent 35%),radial-gradient(circle at 100% 100%,#064f5b,transparent 42%),var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
    main{width:min(780px,100%);margin:auto;padding:clamp(16px,4vw,32px)}
    header{display:flex;justify-content:space-between;gap:14px;align-items:start}
    h1{font-size:clamp(1.45rem,5vw,2rem);margin:0}
    p{color:var(--muted);margin:.35rem 0}
    .hud,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
    .chip,button{min-height:44px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#18284b;color:var(--ink);padding:.7rem .9rem;font-weight:800}
    button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button:hover,button:focus-visible{outline:2px solid #55e0ce;outline-offset:2px}
    button:disabled{opacity:.45;cursor:not-allowed}
    .accent{background:linear-gradient(120deg,#5567ff,#00cbb7)}
    #board{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:18px;align-items:end;padding:24px 4px}
    .tube{position:relative;height:232px;min-width:58px;padding:6px 7px 9px;overflow:hidden;border:3px solid rgba(235,243,255,.82);border-top-color:rgba(235,243,255,.42);border-radius:13px 13px 27px 27px;background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.025) 35%,rgba(255,255,255,.08) 80%,rgba(255,255,255,.02));display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:0;box-shadow:inset 0 -7px 12px rgba(0,0,0,.15),0 10px 22px rgba(0,0,0,.16);transition:transform .18s,border-color .18s,box-shadow .18s}
    .tube::after{content:"";position:absolute;inset:7px auto 16px 11px;width:5px;border-radius:99px;background:linear-gradient(rgba(255,255,255,.48),transparent 72%);pointer-events:none}
    .tube.selected{transform:translateY(-12px);border-color:#62eed5;box-shadow:0 0 0 4px rgba(98,238,213,.18),0 18px 30px rgba(0,0,0,.23)}
    .tube.receiving{animation:receive .28s ease-out}
    .liquid{position:relative;display:block;width:100%;flex:0 0 25%;min-height:24px;background:linear-gradient(90deg,var(--liquid),var(--liquid-hi),var(--liquid));box-shadow:inset 0 7px 10px rgba(255,255,255,.13),inset 0 -6px 8px rgba(0,0,0,.12);transition:transform .2s}
    .liquid.top{border-radius:9px 9px 2px 2px}
    .liquid.top::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:6px;border-radius:50%;background:rgba(255,255,255,.24)}
    .liquid.bottom{border-radius:2px 2px 17px 17px}
    .liquid.only{border-radius:9px 9px 17px 17px}
    #status{min-height:2.8em;font-weight:700}
    .win{color:#5af0c7}
    @keyframes receive{0%{transform:scale(.96)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
    @media(max-width:480px){
      body{overflow-x:hidden}
      main{min-height:100dvh;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
      header{align-items:center}
      header p{max-width:220px;font-size:.78rem;line-height:1.35}
      .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
      .chip{text-align:center}
      .chip,button{font-size:.8rem;padding:.5rem .55rem}
      #board{flex:1;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:8px;align-content:center;padding:12px 2px}
      .tube{width:100%;height:clamp(150px,30dvh,194px);min-width:0;padding:4px 5px 7px;border-width:2px;border-radius:10px 10px 19px 19px}
      .tube::after{inset:6px auto 13px 7px;width:3px}
      .liquid.bottom{border-radius:1px 1px 12px 12px}
      .liquid.only{border-radius:7px 7px 12px 12px}
      #status{margin:.25rem 0;min-height:2.4em;font-size:.82rem}
      .actions{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 0;padding:6px 0;background:linear-gradient(transparent,var(--bg) 30%)}
    }
  </style>
</head>
<body>
<main>
  <header><div><h1>Color Sort</h1><p>Pour matching liquid into one tube. Tap a tube, then its destination.</p></div><button id="new" class="accent">New level</button></header>
  <div class="hud"><span class="chip">Moves <b id="moves">0</b></span><span class="chip">Best <b id="best">—</b></span><span class="chip">Level <b id="level">1</b></span></div>
  <div id="board" aria-label="Color sorting tubes"></div>
  <p id="status" role="status">Choose a tube to begin.</p>
  <div class="actions"><button id="undo">↶ Undo</button><button id="reset">Reset</button><button id="hint">Hint</button></div>
</main>
<script>
(()=>{
  const KEY='vyb.game.color-sort.v2',CAP=4,COLORS=[
    {base:'#ff4d5e',hi:'#ff8994'},{base:'#39a9ff',hi:'#8bd0ff'},{base:'#ffc928',hi:'#ffe477'},
    {base:'#8b63ff',hi:'#bda8ff'},{base:'#21d6a3',hi:'#79f0ce'},{base:'#ff72b6',hi:'#ffabd3'},{base:'#ff812b',hi:'#ffb276'}
  ];
  let s={level:1,moves:0,best:{},tubes:[],selected:null,history:[]},pouring=null;
  const $=id=>document.getElementById(id),board=$('board');
  function seeded(n){let x=n*9973;return()=>{x=(x*48271)%2147483647;return x/2147483647}}
  function build(level){const n=Math.min(3+Math.floor((level-1)/2),COLORS.length),r=seeded(level),items=Array.from({length:n},(_,i)=>Array(CAP).fill(i)).flat();for(let i=items.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return Array.from({length:n},(_,i)=>items.slice(i*CAP,i*CAP+CAP)).concat([[],[]])}
  function save(){localStorage.setItem(KEY,JSON.stringify({...s,selected:null,history:[]}))}
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tubes))s={...s,...x,selected:null,history:[]}}catch{}}
  function top(t){return t[t.length-1]}
  function pourAmount(a,b){if(a===b||!s.tubes[a].length||s.tubes[b].length>=CAP)return 0;const color=top(s.tubes[a]);if(s.tubes[b].length&&top(s.tubes[b])!==color)return 0;let run=0;for(let i=s.tubes[a].length-1;i>=0&&s.tubes[a][i]===color;i--)run++;return Math.min(run,CAP-s.tubes[b].length)}
  function canMove(a,b){return pourAmount(a,b)>0}
  function solved(){return s.tubes.every(t=>!t.length||t.length===CAP&&t.every(c=>c===t[0]))}
  function render(){
    board.innerHTML='';
    s.tubes.forEach((tube,i)=>{const el=document.createElement('button');el.className='tube'+(s.selected===i?' selected':'')+(pouring===i?' receiving':'');el.ariaLabel='Tube '+(i+1)+', '+tube.length+' liquid layers';el.onclick=()=>pick(i);tube.forEach((color,index)=>{const layer=document.createElement('span');layer.className='liquid'+(index===tube.length-1?' top':'')+(index===0?' bottom':'')+(tube.length===1?' only':'');layer.style.setProperty('--liquid',COLORS[color].base);layer.style.setProperty('--liquid-hi',COLORS[color].hi);el.append(layer)});board.append(el)});
    $('moves').textContent=s.moves;$('level').textContent=s.level;$('best').textContent=s.best[s.level]??'—';$('undo').disabled=!s.history.length;
    const isWin=solved();$('status').textContent=isWin?'Level complete! Start the next one.':s.selected===null?'Choose a tube to begin.':'Choose a matching tube with room.';$('status').className=isWin?'win':'';save();
  }
  function pick(i){
    if(solved())return;
    if(s.selected===null){if(s.tubes[i].length)s.selected=i;render();return}
    if(s.selected===i){s.selected=null;render();return}
    const amount=pourAmount(s.selected,i);
    if(amount){s.history.push({tubes:s.tubes.map(t=>[...t]),moves:s.moves});for(let n=0;n<amount;n++)s.tubes[i].push(s.tubes[s.selected].pop());s.moves++;s.selected=null;pouring=i;if(solved()&&(!s.best[s.level]||s.moves<s.best[s.level]))s.best[s.level]=s.moves;render();setTimeout(()=>{pouring=null;render()},280);return}
    s.selected=s.tubes[i].length?i:null;render();
  }
  function start(next=false){if(next)s.level++;s.moves=0;s.selected=null;s.history=[];s.tubes=build(s.level);render()}
  $('new').onclick=()=>start(true);
  $('reset').onclick=()=>{s.moves=0;s.selected=null;s.history=[];s.tubes=build(s.level);render()};
  $('undo').onclick=()=>{const previous=s.history.pop();if(previous){s.tubes=previous.tubes;s.moves=previous.moves;s.selected=null;render()}};
  $('hint').onclick=()=>{for(let a=0;a<s.tubes.length;a++)for(let b=0;b<s.tubes.length;b++)if(canMove(a,b)){s.selected=a;render();setTimeout(()=>{if(s.selected===a){s.selected=null;render()}},900);return}};
  load();if(!s.tubes.length)s.tubes=build(s.level);render();
})();
</script>
</body>
</html>
