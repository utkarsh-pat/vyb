<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vyb Color Sort</title><style>
:root{color-scheme:dark;--bg:#09152b;--panel:#111f3d;--ink:#f5f7ff;--muted:#aebbd9;--accent:#4e7cff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 0,#273d78,transparent 35%),radial-gradient(circle at 100% 100%,#064f5b,transparent 42%),var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{width:min(780px,100%);margin:auto;padding:clamp(16px,4vw,32px)}header{display:flex;justify-content:space-between;gap:14px;align-items:start}h1{font-size:clamp(1.45rem,5vw,2rem);margin:0}p{color:var(--muted);margin:.35rem 0}.hud,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.chip,button{min-height:44px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#18284b;color:var(--ink);padding:.7rem .9rem;font-weight:800}button{cursor:pointer;touch-action:manipulation}button:hover,button:focus-visible{outline:2px solid #55e0ce;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.accent{background:linear-gradient(120deg,#5567ff,#00cbb7)}#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:14px;align-items:end;padding:20px 4px}.tube{height:232px;min-width:58px;padding:5px;border:3px solid rgba(235,243,255,.68);border-top:0;border-radius:0 0 25px 25px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 40%,rgba(255,255,255,.04));display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px;cursor:pointer;transition:transform .16s,border-color .16s}.tube.selected{transform:translateY(-9px);border-color:#62eed5;box-shadow:0 0 0 4px rgba(98,238,213,.18)}.ball{height:calc((100% - 24px)/4);border-radius:50%;box-shadow:inset -8px -8px 14px rgba(0,0,0,.24),inset 7px 7px 10px rgba(255,255,255,.25)}#status{min-height:2.8em;font-weight:700}.win{color:#5af0c7}@media(max-width:480px){body{overflow-x:hidden}main{min-height:100dvh;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{align-items:center}header p{max-width:220px;font-size:.78rem;line-height:1.35}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.chip{text-align:center}.chip,button{font-size:.8rem;padding:.5rem .55rem}#board{flex:1;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:7px;align-content:center;padding:8px 2px}.tube{width:100%;height:clamp(145px,30dvh,190px);min-width:0;border-width:2px;border-radius:0 0 18px 18px}#status{margin:.25rem 0;min-height:2.4em;font-size:.82rem}.actions{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 0;padding:6px 0;background:linear-gradient(transparent,var(--bg) 30%)}}</style></head><body><main><header><div><h1>Color Sort</h1><p>Make every tube a single colour. Tap a tube, then its destination.</p></div><button id="new" class="accent">New level</button></header><div class="hud"><span class="chip">Moves <b id="moves">0</b></span><span class="chip">Best <b id="best">—</b></span><span class="chip">Level <b id="level">1</b></span></div><div id="board" aria-label="Color sorting tubes"></div><p id="status" role="status">Choose a tube to begin.</p><div class="actions"><button id="undo">↶ Undo</button><button id="reset">Reset</button><button id="hint">Hint</button></div></main><script>
document.head.insertAdjacentHTML('beforeend','<style>.ball{display:block;width:100%;flex:0 0 calc((100% - 24px)/4);min-height:24px}</style>');
(()=>{const KEY='vyb.game.color-sort.v1',CAP=4,COLORS=['#f25f65','#55b4ff','#f6c54b','#8b6bea','#32d0a7','#f48cbd','#ff8e44'];let s={level:1,moves:0,best:{},tubes:[],selected:null,history:[]};const $=id=>document.getElementById(id),board=$('board');
function seeded(n){let x=n*9973;return()=>{x=(x*48271)%2147483647;return x/2147483647}}
function build(level){const n=Math.min(3+Math.floor((level-1)/2),COLORS.length),r=seeded(level),items=Array.from({length:n},(_,i)=>Array(CAP).fill(COLORS[i])).flat();for(let i=items.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return Array.from({length:n},(_,i)=>items.slice(i*CAP,i*CAP+CAP)).concat([[],[]])}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tubes))s={...s,...x,selected:null,history:[]}}catch{}}function top(t){return t[t.length-1]}function canMove(a,b){return a!==b&&s.tubes[a].length&&s.tubes[b].length<CAP&&(!s.tubes[b].length||top(s.tubes[a])===top(s.tubes[b]))}function solved(){return s.tubes.every(t=>!t.length||t.length===CAP&&t.every(c=>c===t[0]))}
function render(){board.innerHTML='';s.tubes.forEach((tube,i)=>{let el=document.createElement('button');el.className='tube'+(s.selected===i?' selected':'');el.ariaLabel=`Tube ${i+1}, ${tube.length} balls`;el.onclick=()=>pick(i);tube.forEach(color=>{let b=document.createElement('span');b.className='ball';b.style.background=color;el.append(b)});board.append(el)});$('moves').textContent=s.moves;$('level').textContent=s.level;$('best').textContent=s.best[s.level]??'—';$('undo').disabled=!s.history.length;const isWin=solved();$('status').textContent=isWin?'Level complete! Start the next one.':s.selected===null?'Choose a tube to begin.':'Choose a compatible destination.';$('status').className=isWin?'win':'';save()}
function pick(i){if(solved())return;if(s.selected===null){if(s.tubes[i].length)s.selected=i}else if(s.selected===i)s.selected=null;else if(canMove(s.selected,i)){s.history.push(s.tubes.map(t=>[...t]));s.tubes[i].push(s.tubes[s.selected].pop());s.moves++;s.selected=null;if(solved()&&(!s.best[s.level]||s.moves<s.best[s.level]))s.best[s.level]=s.moves}else{s.selected=s.tubes[i].length?i:null}render()}
function start(next=false){if(next)s.level++;s.moves=0;s.selected=null;s.history=[];s.tubes=build(s.level);render()}$('new').onclick=()=>start(true);$('reset').onclick=()=>{s.moves=0;s.selected=null;s.history=[];s.tubes=build(s.level);render()};$('undo').onclick=()=>{let p=s.history.pop();if(p){s.tubes=p;s.moves--;s.selected=null;render()}};$('hint').onclick=()=>{for(let a=0;a<s.tubes.length;a++)for(let b=0;b<s.tubes.length;b++)if(canMove(a,b)){s.selected=a;render();setTimeout(()=>{if(s.selected===a){s.selected=null;render()}},700);return}};load();if(!s.tubes.length)s.tubes=build(s.level);render()})();
</script></body></html>
