<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vyb Word Puzzle</title><style>
@media(max-width:480px){main{height:auto!important;min-height:100vh!important;overflow:visible!important}}
@media(max-width:480px){#grid{width:min(70vw,270px)!important;margin:7px auto!important;gap:4px!important}.keyboard{gap:4px!important}.keyrow{gap:2px!important}.key{min-height:38px!important;padding:.35rem .08rem!important}}
:root{color-scheme:dark;--bg:#07152b;--cell:#172848;--ink:#f8faff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 5%,#3d3278,transparent 38%),var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{width:min(560px,100%);margin:auto;padding:clamp(16px,4vw,32px)}h1{margin:0}p{color:#b7c3dc}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.top button{min-height:44px;border:1px solid #617ab8;background:#1b3159;color:#fff;border-radius:11px;padding:.65rem .8rem;font-weight:800;cursor:pointer;touch-action:manipulation}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:390px;margin:28px auto;contain:layout paint}.cell{aspect-ratio:1;display:grid;place-items:center;border:2px solid #526886;background:var(--cell);font-size:clamp(1.35rem,6vw,2rem);font-weight:900;border-radius:8px}.correct{background:#26a269;border-color:#26a269}.present{background:#c79825;border-color:#c79825}.absent{background:#46546d;border-color:#46546d}.keyboard{display:grid;gap:7px}.keyrow{display:flex;gap:5px;justify-content:center}.key{min-width:30px;min-height:44px;flex:1;max-width:44px;border:0;border-radius:7px;background:#536681;color:#fff;padding:.8rem .25rem;font-weight:900;cursor:pointer;touch-action:manipulation}.key.wide{max-width:76px}.key.correct{background:#26a269}.key.present{background:#c79825}.key.absent{background:#46546d}#status{min-height:2.8em;text-align:center;font-weight:800}@media(max-width:480px){main{height:100dvh;padding:10px 7px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}.top{align-items:center;padding-inline:3px}.top h1{font-size:1.3rem}.top p{max-width:220px;margin:.25rem 0;font-size:.75rem;line-height:1.3}.top button{padding:.5rem .65rem;font-size:.75rem}#grid{width:min(84vw,330px);margin:10px auto;gap:5px}.cell{border-radius:5px;font-size:clamp(1.15rem,7vw,1.7rem)}#status{min-height:2.5em;margin:.2rem 0;font-size:.8rem}.keyboard{margin-top:auto;gap:6px}.keyrow{gap:3px}.key{min-width:0;min-height:44px;padding:.5rem .1rem;font-size:.72rem}.key.wide{max-width:62px}}</style></head><body><main><div class="top"><div><h1>Word Puzzle</h1><p>Find the five-letter word in six tries. A fresh local challenge is chosen each day.</p></div><button id="reset">New word</button></div><div id="grid" aria-label="Word puzzle grid"></div><p id="status" role="status"></p><div id="keyboard" class="keyboard" aria-label="Keyboard"></div></main><script>
(()=>{const WORDS=['VYBES','LEARN','NIGHT','SMART','STUDY','GAMES','CHESS','QUEEN','BOARD','COLOR','UNITY','VOICE','DRIVE','HOUSE','PLANT','LIGHT','WORDS','LOGIC','MATCH','SCORE'],KEY='vyb.game.word-puzzle.v1',$=x=>document.getElementById(x);let day=Math.floor(Date.now()/864e5),s={word:WORDS[day%WORDS.length],rows:[],current:'',done:false};function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.day===day&&typeof x.word==='string'&&x.word.length===5)s=x}catch{}}function save(){localStorage.setItem(KEY,JSON.stringify({...s,day}))}function mark(word){let out=Array(5).fill('absent'),left=s.word.split('');[...word].forEach((l,i)=>{if(l===left[i]){out[i]='correct';left[i]=null}});[...word].forEach((l,i)=>{if(out[i]!=='correct'){let p=left.indexOf(l);if(p>=0){out[i]='present';left[p]=null}}});return out}function render(){let g=$('grid');g.innerHTML='';for(let r=0;r<6;r++){let w=s.rows[r]??(r===s.rows.length?s.current:'');let marks=r<s.rows.length?mark(w):[];for(let i=0;i<5;i++){let e=document.createElement('div');e.className='cell '+(marks[i]??'');e.textContent=w[i]??'';g.append(e)}}let keys={};s.rows.forEach(w=>mark(w).forEach((m,i)=>{let c=w[i];if(!keys[c]||['absent','present','correct'].indexOf(m)>['absent','present','correct'].indexOf(keys[c]))keys[c]=m}));document.querySelectorAll('.key[data-k]').forEach(e=>e.className='key '+(keys[e.dataset.k]??'')+(e.dataset.k==='ENTER'||e.dataset.k==='BACK'?' wide':''));$('status').textContent=s.done?(s.rows.at(-1)===s.word?'Great solve!':'The word was '+s.word+'.'):s.current.length?'':`Attempt ${s.rows.length+1} of 6`;save()}function input(k){if(s.done)return;if(k==='BACK')s.current=s.current.slice(0,-1);else if(k==='ENTER'){if(s.current.length!==5){$('status').textContent='Enter five letters.';return}s.rows.push(s.current);s.done=s.current===s.word||s.rows.length===6;s.current=''}else if(s.current.length<5)s.current+=k;render()}function setupKeys(){let q='QWERTYUIOP|ASDFGHJKL|ENTERZXCVBNMBACK'.split('|');let k=$('keyboard');k.innerHTML='';q.forEach(row=>{let d=document.createElement('div');d.className='keyrow';let parts=row.match(/ENTER|BACK|[A-Z]/g)||[];parts.forEach(x=>{let b=document.createElement('button');b.className='key '+(x.length>1?'wide':'');b.dataset.k=x;b.textContent=x==='BACK'?'⌫':x;b.onclick=()=>input(x);d.append(b)});k.append(d)})}document.addEventListener('keydown',e=>{let k=e.key.toUpperCase();if(/^[A-Z]$/.test(k)||k==='ENTER'||k==='BACKSPACE'){e.preventDefault();input(k==='BACKSPACE'?'BACK':k)}});$('reset').onclick=()=>{s={word:WORDS[Math.floor(Math.random()*WORDS.length)],rows:[],current:'',done:false};render()};load();setupKeys();render()})();
</script></body></html>
