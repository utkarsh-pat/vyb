type Post @table(name: "posts", singular: "post", plural: "posts", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenant: Tenant!
  community: Community
  membership: TenantMembership!
  authorUserId: UUID @col(name: "author_user_id")
  authorUsername: String @col(name: "author_username")
  authorName: String @col(name: "author_name")
  authorEmail: String @col(name: "author_email")
  isAnonymous: Boolean! @col(name: "is_anonymous") @default(value: false)
  allowAnonymousComments: Boolean! @col(name: "allow_anonymous_comments") @default(value: true)
  placement: String! @default(value: "feed")
  kind: String! @default(value: "text")
  title: String
  body: String!
  mediaUrl: String @col(name: "media_url")
  storagePath: String @col(name: "storage_path")
  mediaMimeType: String @col(name: "media_mime_type")
  mediaSizeBytes: Int64 @col(name: "media_size_bytes")
  location: String
  visibility: String! @default(value: "tenant")
  status: String! @default(value: "pending")
  reactionsCount: Int! @col(name: "reactions_count") @default(value: 0)
  commentsCount: Int! @col(name: "comments_count") @default(value: 0)
  publishedAt: Timestamp @col(name: "published_at")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type PostMedia @table(name: "post_media", singular: "postMedia", plural: "postMediaRecords", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenant: Tenant!
  post: Post!
  mediaUrl: String @col(name: "media_url")
  storagePath: String! @col(name: "storage_path")
  mediaType: String! @col(name: "media_type")
  mimeType: String! @col(name: "mime_type")
  sizeBytes: Int64! @col(name: "size_bytes")
  position: Int! @default(value: 0)
  width: Int
  height: Int
  durationMs: Int @col(name: "duration_ms")
  processingStatus: String! @col(name: "processing_status") @default(value: "pending")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type Comment @table(name: "comments", singular: "comment", plural: "comments", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenant: Tenant!
  post: Post!
  membership: TenantMembership!
  authorUserId: UUID @col(name: "author_user_id")
  authorEmail: String @col(name: "author_email")
  isAnonymous: Boolean! @col(name: "is_anonymous") @default(value: false)
  parentComment: Comment
  body: String!
  mediaUrl: String @col(name: "media_url")
  mediaType: String @col(name: "media_type")
  mediaMimeType: String @col(name: "media_mime_type")
  mediaSizeBytes: Int64 @col(name: "media_size_bytes")
  status: String! @default(value: "published")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type CommentReaction
  @table(name: "comment_reactions", singular: "commentReaction", plural: "commentReactions", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  commentReactionKey: String! @col(name: "comment_reaction_key") @unique
  comment: Comment!
  membership: TenantMembership!
  reactionType: String! @col(name: "reaction_type")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type Reaction @table(name: "reactions", singular: "reaction", plural: "reactions", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  reactionKey: String! @col(name: "reaction_key") @unique
  post: Post!
  membership: TenantMembership!
  reactionType: String! @col(name: "reaction_type")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type PostSave @table(name: "post_saves", singular: "postSave", plural: "postSaves", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenant: Tenant!
  post: Post!
  userId: UUID! @col(name: "user_id")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type Story @table(name: "stories", singular: "story", plural: "stories", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenant: Tenant!
  community: Community
  userId: UUID! @col(name: "user_id")
  username: String!
  displayName: String! @col(name: "display_name")
  mediaType: String! @col(name: "media_type")
  mediaUrl: String! @col(name: "media_url")
  storagePath: String @col(name: "storage_path")
  mediaMimeType: String @col(name: "media_mime_type")
  mediaSizeBytes: Int64 @col(name: "media_size_bytes")
  caption: String
  compositionJson: String @col(name: "composition_json")
  visibility: String! @default(value: "public")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  expiresAt: Timestamp! @col(name: "expires_at")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type StoryReaction
  @table(name: "story_reactions", singular: "storyReaction", plural: "storyReactions", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  storyReactionKey: String! @col(name: "story_reaction_key") @unique
  story: Story!
  membership: TenantMembership!
  reactionType: String! @col(name: "reaction_type")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type StoryView
  @table(name: "story_views", singular: "storyView", plural: "storyViews", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  storyViewKey: String! @col(name: "story_view_key") @unique
  story: Story!
  membership: TenantMembership!
  seenAt: Timestamp! @col(name: "seen_at") @default(expr: "request.time")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type Follow @table(name: "follows", singular: "follow", plural: "follows", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  followKey: String! @col(name: "follow_key") @unique
  tenant: Tenant!
  followerUserId: UUID! @col(name: "follower_user_id")
  followingUserId: UUID! @col(name: "following_user_id")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

# A block is tenant-scoped and symmetric at read time: content and profile
# discovery are hidden when either side has an active row. Keeping this as a
# first-class server record prevents per-device moderation state from drifting.
type UserBlock
  @table(name: "user_blocks", singular: "userBlock", plural: "userBlocks", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  blockKey: String! @col(name: "block_key") @unique
  tenant: Tenant!
  blockerUserId: UUID! @col(name: "blocker_user_id")
  blockedUserId: UUID! @col(name: "blocked_user_id")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

# Small, durable invalidation records for feed reconciliation. The row never
# contains post bodies or media; clients re-fetch the authoritative entity.
# A bounded retention job can delete expired rows without affecting posts.
type FeedChangeEvent
  @table(
    name: "feed_change_events"
    singular: "feedChangeEvent"
    plural: "feedChangeEvents"
    key: ["id"]
  )
  @index(fields: ["tenantId", "createdAt"], order: [ASC, DESC]) {
  id: UUID! @default(expr: "uuidV4()")
  eventKey: String! @col(name: "event_key") @unique
  tenant: Tenant!
  entityType: String! @col(name: "entity_type")
  entityId: UUID! @col(name: "entity_id")
  eventType: String! @col(name: "event_type")
  actorUserId: UUID @col(name: "actor_user_id")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  expiresAt: Timestamp! @col(name: "expires_at")
}

# Cross-device privacy preference. When disabled the ingestion API becomes a
# no-op and existing pseudonymous viewer ledgers can be purged on request.
type ContentMeasurementPreference
  @table(
    name: "content_measurement_preferences"
    singular: "contentMeasurementPreference"
    plural: "contentMeasurementPreferences"
    key: ["id"]
  ) {
  id: UUID! @default(expr: "uuidV4()")
  preferenceKey: String! @col(name: "preference_key") @unique
  tenant: Tenant!
  userId: UUID! @col(name: "user_id")
  measurementEnabled: Boolean! @col(name: "measurement_enabled") @default(value: true)
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

# Explicit ranking feedback is separate from engagement so "not interested"
# never masquerades as a reaction and can be honored on every device.
type RecommendationFeedback
  @table(
    name: "recommendation_feedback"
    singular: "recommendationFeedback"
    plural: "recommendationFeedbackRecords"
    key: ["id"]
  ) {
  id: UUID! @default(expr: "uuidV4()")
  feedbackKey: String! @col(name: "feedback_key") @unique
  tenant: Tenant!
  post: Post!
  userId: UUID! @col(name: "user_id")
  action: String!
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  deletedAt: Timestamp @col(name: "deleted_at")
}

# Immutable, short-lived measurement facts. Viewer identifiers are keyed HMAC
# pseudonyms (never email/device advertising IDs) and are removed by retention.
type ContentEvent
  @table(name: "content_events", singular: "contentEvent", plural: "contentEvents", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  eventKey: String! @col(name: "event_key") @unique
  tenant: Tenant!
  post: Post!
  viewerKey: String! @col(name: "viewer_key")
  sessionKey: String! @col(name: "session_key")
  eventType: String! @col(name: "event_type")
  source: String!
  visibleMs: Int! @col(name: "visible_ms") @default(value: 0)
  watchMs: Int! @col(name: "watch_ms") @default(value: 0)
  progressBasisPoints: Int! @col(name: "progress_basis_points") @default(value: 0)
  occurredAt: Timestamp! @col(name: "occurred_at")
  receivedAt: Timestamp! @col(name: "received_at") @default(expr: "request.time")
  expiresAt: Timestamp! @col(name: "expires_at")
  rolledUpAt: Timestamp @col(name: "rolled_up_at")
}

# One row per content/viewer/UTC-day. This is the anti-inflation ledger used by
# ranking; it is intentionally distinct from the non-unique view counter.
type ContentUniqueViewerDay
  @table(
    name: "content_unique_viewer_days"
    singular: "contentUniqueViewerDay"
    plural: "contentUniqueViewerDays"
    key: ["id"]
  ) {
  id: UUID! @default(expr: "uuidV4()")
  uniqueKey: String! @col(name: "unique_key") @unique
  tenant: Tenant!
  post: Post!
  viewerKey: String! @col(name: "viewer_key")
  viewDate: Date! @col(name: "view_date")
  firstViewedAt: Timestamp! @col(name: "first_viewed_at")
  lastViewedAt: Timestamp! @col(name: "last_viewed_at")
  qualifiedViewCount: Int! @col(name: "qualified_view_count") @default(value: 1)
  expiresAt: Timestamp! @col(name: "expires_at")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

# Lifetime exact reach ledger. It stores no raw interaction history.
type ContentUniqueViewer
  @table(
    name: "content_unique_viewers"
    singular: "contentUniqueViewer"
    plural: "contentUniqueViewers"
    key: ["id"]
  ) {
  id: UUID! @default(expr: "uuidV4()")
  uniqueKey: String! @col(name: "unique_key") @unique
  tenant: Tenant!
  post: Post!
  viewerKey: String! @col(name: "viewer_key")
  firstViewedAt: Timestamp! @col(name: "first_viewed_at")
  lastViewedAt: Timestamp! @col(name: "last_viewed_at")
  qualifiedViewCount: Int! @col(name: "qualified_view_count") @default(value: 1)
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

type ContentDailyInsight
  @table(
    name: "content_daily_insights"
    singular: "contentDailyInsight"
    plural: "contentDailyInsights"
    key: ["id"]
  ) {
  id: UUID! @default(expr: "uuidV4()")
  insightKey: String! @col(name: "insight_key") @unique
  tenant: Tenant!
  post: Post!
  insightDate: Date! @col(name: "insight_date")
  impressionCount: Int! @col(name: "impression_count") @default(value: 0)
  qualifiedViewCount: Int! @col(name: "qualified_view_count") @default(value: 0)
  uniqueReachCount: Int! @col(name: "unique_reach_count") @default(value: 0)
  videoPlayCount: Int! @col(name: "video_play_count") @default(value: 0)
  videoViewCount: Int! @col(name: "video_view_count") @default(value: 0)
  replayCount: Int! @col(name: "replay_count") @default(value: 0)
  watchMsTotal: Int64! @col(name: "watch_ms_total") @default(value: 0)
  completionCount: Int! @col(name: "completion_count") @default(value: 0)
  carouselSlideCount: Int! @col(name: "carousel_slide_count") @default(value: 0)
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

# Durable privacy cleanup request created atomically with post soft deletion.
# The delayed maintenance sweep closes races with already-authorized in-flight
# event requests before deleting this request.
type ContentPurgeRequest
  @table(
    name: "content_purge_requests"
    singular: "contentPurgeRequest"
    plural: "contentPurgeRequests"
    key: ["id"]
  ) {
  id: UUID! @default(expr: "uuidV4()")
  purgeKey: String! @col(name: "purge_key") @unique
  tenant: Tenant!
  post: Post!
  requestedAt: Timestamp! @col(name: "requested_at") @default(expr: "request.time")
}

