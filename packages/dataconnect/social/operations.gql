      updatedAt_expr: "request.time"
    }
  )
  contentPurgeRequest_insert(
    data: {
      id: $purgeRequestId
      purgeKey: $purgeKey
      tenantId: $tenantId
      postId: $id
      requestedAt_expr: "request.time"
    }
  )
}

mutation SoftDeletePostWithPurgeAndFeedChange(
  $id: UUID!
  $tenantId: UUID!
  $purgeRequestId: UUID!
  $purgeKey: String!
  $actorUserId: UUID
  $feedChangeId: UUID!
  $feedChangeEventKey: String!
  $feedChangeExpiresAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  post_update(
    key: { id: $id }
    data: {
      status: "removed"
      deletedAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
  contentPurgeRequest_insert(
    data: {
      id: $purgeRequestId
      purgeKey: $purgeKey
      tenantId: $tenantId
      postId: $id
      requestedAt_expr: "request.time"
    }
  )
  feedChangeEvent_insert(
    data: {
      id: $feedChangeId
      eventKey: $feedChangeEventKey
      tenantId: $tenantId
      entityType: "post"
      entityId: $id
      eventType: "post.deleted"
      actorUserId: $actorUserId
      createdAt_expr: "request.time"
      expiresAt: $feedChangeExpiresAt
    }
  )
}

