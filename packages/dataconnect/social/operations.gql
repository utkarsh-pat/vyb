mutation CreatePost(
  $id: UUID
  $tenantId: UUID!
  $communityId: UUID
  $membershipId: UUID!
  $authorUserId: UUID
  $authorUsername: String! = "vyb_user"
  $authorName: String! = "Vyb Student"
  $authorEmail: String
  $isAnonymous: Boolean! = false
  $allowAnonymousComments: Boolean! = true
  $placement: String! = "feed"
  $kind: String!
  $title: String
  $body: String!
  $mediaUrl: String
  $storagePath: String
  $mediaMimeType: String
  $mediaSizeBytes: Int64
  $location: String
  $status: String!
) @auth(level: NO_ACCESS) @transaction {
  post_insert(
    data: {
      id: $id
      tenantId: $tenantId
      communityId: $communityId
      membershipId: $membershipId
      authorUserId: $authorUserId
      authorUsername: $authorUsername
      authorName: $authorName
      authorEmail: $authorEmail
      isAnonymous: $isAnonymous
      allowAnonymousComments: $allowAnonymousComments
      placement: $placement
      kind: $kind
      title: $title
      body: $body
      mediaUrl: $mediaUrl
      storagePath: $storagePath
      mediaMimeType: $mediaMimeType
      mediaSizeBytes: $mediaSizeBytes
      location: $location
      status: $status
      visibility: "tenant"
      publishedAt_expr: "request.time"
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
}

mutation CreatePostWithFeedChange(
  $id: UUID!
  $tenantId: UUID!
  $communityId: UUID
  $membershipId: UUID!
  $authorUserId: UUID
  $authorUsername: String! = "vyb_user"
  $authorName: String! = "Vyb Student"
  $authorEmail: String
  $isAnonymous: Boolean! = false
  $allowAnonymousComments: Boolean! = true
  $visibility: String! = "public"
  $placement: String! = "feed"
  $kind: String!
  $title: String
  $body: String!
  $mediaUrl: String
  $storagePath: String
  $mediaMimeType: String
  $mediaSizeBytes: Int64
  $location: String
  $status: String!
  $feedChangeId: UUID!
  $feedChangeEventKey: String!
  $feedChangeExpiresAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  post_insert(
    data: {
      id: $id
      tenantId: $tenantId
      communityId: $communityId
      membershipId: $membershipId
      authorUserId: $authorUserId
      authorUsername: $authorUsername
      authorName: $authorName
      authorEmail: $authorEmail
      isAnonymous: $isAnonymous
      allowAnonymousComments: $allowAnonymousComments
      visibility: $visibility
      placement: $placement
      kind: $kind
      title: $title
      body: $body
      mediaUrl: $mediaUrl
      storagePath: $storagePath
      mediaMimeType: $mediaMimeType
      mediaSizeBytes: $mediaSizeBytes
      location: $location
      status: $status
      publishedAt_expr: "request.time"
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
  feedChangeEvent_insert(
    data: {
      id: $feedChangeId
      eventKey: $feedChangeEventKey
      tenantId: $tenantId
      entityType: "post"
      entityId: $id
      eventType: "post.created"
      actorUserId: $authorUserId
      createdAt_expr: "request.time"
      expiresAt: $feedChangeExpiresAt
    }
  )
}

