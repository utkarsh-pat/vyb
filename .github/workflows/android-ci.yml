name: Android CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Provision Firebase Android configuration
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          config_path="app/google-services.json"
          if [[ ! -f "$config_path" && -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$config_path"
          fi
          if [[ ! -s "$config_path" ]]; then
            echo "::error file=apps/mobile/app/google-services.json::Firebase Android configuration is missing. Add the repository secret GOOGLE_SERVICES_JSON_BASE64 containing the base64-encoded vybnet google-services.json."
            exit 1
          fi
          if ! grep -q '"project_id": "vybnet"' "$config_path"; then
            echo "::error file=apps/mobile/app/google-services.json::Firebase Android configuration does not target project_id vybnet."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        working-directory: apps/mobile
        run: chmod +x gradlew

      - name: Verify Android app
        working-directory: apps/mobile
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/mobile/app/build/reports/tests/testDebugUnitTest/
            apps/mobile/app/build/reports/lint-results-debug.html
            apps/mobile/app/build/reports/lint-results-debug.xml

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vyb-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
