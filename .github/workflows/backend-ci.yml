name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/config/**"
      - "packages/dataconnect/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".gcloudignore"
      - "cloudbuild.backend.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/config/**"
      - "packages/dataconnect/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".gcloudignore"
      - "cloudbuild.backend.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile --filter @vyb/backend...

      - name: Check backend entry points
        run: pnpm --filter @vyb/backend check

      - name: Run backend unit tests
        env:
          VYB_FCM_WORKER_DISABLED: "1"
        run: pnpm --filter @vyb/backend test
